<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三条必记的原则分别对应写之前、排查时、交付前，其余二十一条按场景查表"><defs><marker id="principles-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="60.0" y="48.0" width="240.0" height="44.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="180.0" y="75.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">写之前</text><line x1="180.0" y1="92.0" x2="180.0" y2="128.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#principles-arrow)"/><rect x="60.0" y="132.0" width="240.0" height="76.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="180.0" y="163.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">laziness-protocol</text><text x="180.0" y="185.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">能删就删，最小改动</text><rect x="330.0" y="48.0" width="240.0" height="44.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="450.0" y="75.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">排查时</text><line x1="450.0" y1="92.0" x2="450.0" y2="128.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#principles-arrow)"/><rect x="330.0" y="132.0" width="240.0" height="76.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="450.0" y="163.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">fix-root-causes</text><text x="450.0" y="185.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">追到第一次出错的地方</text><rect x="600.0" y="48.0" width="240.0" height="44.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="720.0" y="75.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">交付前</text><line x1="720.0" y1="92.0" x2="720.0" y2="128.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#principles-arrow)"/><rect x="600.0" y="132.0" width="240.0" height="76.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="720.0" y="163.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">prove-it-works</text><text x="720.0" y="185.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">验真实产物，不验代理指标</text><line x1="300.0" y1="70.0" x2="328.0" y2="70.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#principles-arrow)"/><line x1="570.0" y1="70.0" x2="598.0" y2="70.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#principles-arrow)"/><rect x="60" y="252" width="780" height="92" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-dasharray="6 5"/><text x="450.0" y="284.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted)">其余 21 条：设计取舍、边界与类型、并行与共享状态、上下文预算</text><text x="450.0" y="314.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted)">平时不用背，遇到具体场景回第 5 章那张表查</text></svg></div><figcaption>先记住这三条，剩下的遇到具体场景再查表，不要一次背二十四条。</figcaption></figure>