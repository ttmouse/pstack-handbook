<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一个缺陷从复现到提交的六个步骤，第五步不通过时回到第二步"><defs><marker id="story-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="195.0" y="31.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="430.0" y="53.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">1 先让它重现出来</text><text x="430.0" y="75.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">点几下，确认真的会吞</text><rect x="195.0" y="117.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="430.0" y="139.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">2 猜几个可能的原因</text><text x="430.0" y="161.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">没收到？收到了被忽略？没画出来？</text><rect x="195.0" y="203.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="430.0" y="225.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">3 一个个排除，拿到运行时证据</text><text x="430.0" y="247.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">加一行日志，看按键到底进没进来</text><rect x="195.0" y="289.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="430.0" y="311.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">4 找到原因，只改那一处</text><text x="430.0" y="333.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">不是顺手多改几处</text><rect x="195.0" y="375.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="430.0" y="397.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">5 回到同一个地方再试一遍</text><text x="430.0" y="419.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">同一个入口，同样的连按速度</text><rect x="195.0" y="461.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="430.0" y="483.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">6 交上去，写清是怎么回事</text><text x="430.0" y="505.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">改了什么、为什么、怎么验的</text><line x1="430.0" y1="89.0" x2="430.0" y2="117.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#story-arrow)"/><line x1="430.0" y1="175.0" x2="430.0" y2="203.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#story-arrow)"/><line x1="430.0" y1="261.0" x2="430.0" y2="289.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#story-arrow)"/><line x1="430.0" y1="347.0" x2="430.0" y2="375.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#story-arrow)"/><line x1="430.0" y1="433.0" x2="430.0" y2="461.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#story-arrow)"/><path d="M 195.0 404.0 L 120.0 404.0 L 120.0 146.0 L 194.0 146.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#story-arrow)"/><text x="104.0" y="275.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)" transform="rotate(-90 104.0 275.0)">不通就回头</text><rect x="672" y="208" width="212" height="128" rx="10" fill="none" stroke="var(--line)" stroke-dasharray="6 5"/><text x="686.0" y="236.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--accent2)">最容易被跳过的两步</text><text x="686.0" y="264.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">第 2 步 猜原因</text><text x="686.0" y="288.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">第 5 步 回原地再试</text><text x="686.0" y="316.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">跳了，结论就不可信</text></svg></div><figcaption>六步里最容易跳过的是第二步和第五步。整套流程只是把这两步固定下来。</figcaption></figure>