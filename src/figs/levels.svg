<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="把纠正变成结构的四级顺序，从改架构到口头提醒，效果依次递减"><defs><marker id="levels-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="40.0" y="30.0" width="820.0" height="90.0" rx="10" fill="var(--panel)" stroke="var(--ok)" stroke-width="1.4"/><text x="450.0" y="68.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">第一级 改架构或数据结构 → 根除</text><text x="450.0" y="90.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">让这个错在类型或结构上写不出来</text><rect x="40.0" y="140.0" width="720.0" height="90.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="400.0" y="178.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">第二级 加检查规则或测试 → 拦住</text><text x="400.0" y="200.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">流水线里过不去，不靠人记</text><rect x="40.0" y="250.0" width="620.0" height="90.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="350.0" y="288.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">第三级 写进技能或规则文档 → 靠自觉</text><text x="350.0" y="310.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">它读到了才生效，读不到等于没写</text><rect x="40.0" y="360.0" width="520.0" height="90.0" rx="10" fill="var(--panel)" stroke="var(--bad)" stroke-width="1.4"/><text x="300.0" y="398.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">第四级 评审时口头说一遍 → 没戏</text><text x="300.0" y="420.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">下次还会犯，你已经说过三遍了</text><text x="470.0" y="24.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted)">效果从强到弱</text></svg></div><figcaption>从上往下，效果递减。你在第四级说过三遍的事，应该往上挪一级。</figcaption></figure>