<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="并行前要过的四道门：阻塞前置、文件不重叠、无共享写、单个更慢，任何一道不过就改变策略"><defs><marker id="parallel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="130.0" y="32.0" width="400.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="330.0" y="57.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">第一步：有没有阻塞前置？</text><text x="330.0" y="79.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">必须做完才能开工的步骤</text><line x1="530.0" y1="64.0" x2="566.0" y2="64.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#parallel-arrow)"/><rect x="580.0" y="40.0" width="280.0" height="48.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="720.0" y="69.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">先串行做完，再往下</text><text x="548.0" y="56.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted)">不满足</text><rect x="130.0" y="152.0" width="400.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="330.0" y="177.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">各路文件、服务完全不重叠？</text><text x="330.0" y="199.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">同一文件就是同一个写者</text><line x1="530.0" y1="184.0" x2="566.0" y2="184.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#parallel-arrow)"/><rect x="580.0" y="160.0" width="280.0" height="48.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="720.0" y="189.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">先拆分目标，或串行</text><text x="548.0" y="176.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted)">不满足</text><rect x="130.0" y="272.0" width="400.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="330.0" y="297.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">有没有共享可变状态？</text><text x="330.0" y="319.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">两个代理写同一份数据</text><line x1="530.0" y1="304.0" x2="566.0" y2="304.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#parallel-arrow)"/><rect x="580.0" y="280.0" width="280.0" height="48.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="720.0" y="309.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">只留一个写者</text><text x="548.0" y="296.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted)">不满足</text><rect x="130.0" y="392.0" width="400.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="330.0" y="417.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">单个工人会不会更快？</text><text x="330.0" y="439.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">小改动不值得拆</text><line x1="530.0" y1="424.0" x2="566.0" y2="424.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#parallel-arrow)"/><rect x="580.0" y="400.0" width="280.0" height="48.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="720.0" y="429.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">就开一路，写下理由</text><text x="548.0" y="416.0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted)">不满足</text><line x1="330.0" y1="96.0" x2="330.0" y2="152.0" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#parallel-arrow)"/><text x="344.0" y="130.0" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted)">满足</text><line x1="330.0" y1="216.0" x2="330.0" y2="272.0" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#parallel-arrow)"/><text x="344.0" y="250.0" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted)">满足</text><line x1="330.0" y1="336.0" x2="330.0" y2="392.0" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#parallel-arrow)"/><text x="344.0" y="370.0" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted)">满足</text><line x1="330.0" y1="456.0" x2="330.0" y2="496.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#parallel-arrow)"/><rect x="130.0" y="502.0" width="400.0" height="64.0" rx="10" fill="var(--panel)" stroke="var(--ok)" stroke-width="1.4"/><text x="330.0" y="527.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">开 N 路</text><text x="330.0" y="549.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">每路独立取证，最后只汇总差异</text><text x="330.0" y="620.0" text-anchor="middle" font-size="13" font-weight="400" fill="var(--accent2)">上限不在你能开几路，而在你能验几路。</text><text x="330.0" y="646.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted)">验不过来的那几路，等于没做。</text></svg></div><figcaption>四道门从上往下过。任何一道不过，先改变策略，不要硬拆。</figcaption></figure>