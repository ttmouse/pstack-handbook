<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="修缺陷六步：复现、二分排除、规划、同面验证、提交顺序、开 PR，验证失败回到规划"><defs><marker id="bugfix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="165.0" y="23.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="400.0" y="45.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">1 自己复现</text><text x="400.0" y="67.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">在出问题的同一个面上驱动，能重现才继续</text><rect x="165.0" y="121.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="143.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">2 二分排因</text><text x="400.0" y="165.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">列假设、取运行证据、排除，直到剩一个</text><rect x="165.0" y="219.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="241.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">3 规划修复</text><text x="400.0" y="263.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">跨函数边界先做设计，再派实现</text><rect x="165.0" y="317.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="339.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">4 回同一个面验证</text><text x="400.0" y="361.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">原来失败的操作现在要过，不是跑单测</text><rect x="165.0" y="415.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="437.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">5 排列提交顺序</text><text x="400.0" y="459.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">失败的复现先进历史，修复在后</text><rect x="165.0" y="513.0" width="470.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="535.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">6 开 PR</text><text x="400.0" y="557.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">写清坏在哪、根因、修复、怎么验</text><line x1="400.0" y1="81.0" x2="400.0" y2="109.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#bugfix-arrow)"/><line x1="400.0" y1="179.0" x2="400.0" y2="207.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#bugfix-arrow)"/><line x1="400.0" y1="277.0" x2="400.0" y2="305.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#bugfix-arrow)"/><line x1="400.0" y1="375.0" x2="400.0" y2="403.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#bugfix-arrow)"/><line x1="400.0" y1="473.0" x2="400.0" y2="501.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#bugfix-arrow)"/><path d="M 635 150 C 700 150 700 128 637 128" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#bugfix-arrow)"/><text x="700.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">再来一轮</text><path d="M 165.0 346.0 L 86.0 346.0 L 86.0 248.0 L 164.0 248.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#bugfix-arrow)"/><text x="70.0" y="300.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)" transform="rotate(-90 70.0 300.0)">不通过</text></svg></div><figcaption>两个回环：排除没收敛就再切一刀；同面验证不通过，修改方案而不是修改判据。</figcaption></figure>