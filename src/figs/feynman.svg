<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="费曼循环：选一个概念、讲给外行听、在卡住处停下、回读那一节，再讲一遍"><defs><marker id="feynman-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><text x="60.0" y="108.0" text-anchor="start" font-size="13.5" font-weight="600" fill="var(--accent2)">选一个概念</text><text x="60.0" y="132.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">小到能一口气讲完</text><line x1="200.0" y1="120.0" x2="296.0" y2="120.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feynman-arrow)"/><rect x="300.0" y="88.0" width="300.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="450.0" y="113.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">讲给外行听</text><text x="450.0" y="135.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">不许用术语，不许跳过</text><rect x="530.0" y="438.0" width="300.0" height="64.0" rx="10" fill="var(--panel)" stroke="var(--bad)" stroke-width="1.4"/><text x="680.0" y="463.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">在卡住的地方停下</text><text x="680.0" y="485.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">卡住就是知识缺口</text><rect x="70.0" y="438.0" width="300.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="220.0" y="463.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">回读那一节</text><text x="220.0" y="485.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">只补卡住的那一段</text><path d="M 540.0 158.0 L 646.0 420.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#feynman-arrow)"/><text x="612.0" y="292.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">讲不下去</text><path d="M 528.0 470.0 L 374.0 470.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#feynman-arrow)"/><text x="450.0" y="458.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">翻回去补</text><path d="M 352.0 438.0 L 404.0 158.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#feynman-arrow)"/><text x="336.0" y="300.0" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted)">再讲一遍</text><text x="450.0" y="330.0" text-anchor="middle" font-size="14" font-weight="600" fill="var(--accent2)">讲不通，就是没学会</text></svg></div><figcaption>三个动作走一圈。卡住的那一句，就是你没真懂的地方。</figcaption></figure>