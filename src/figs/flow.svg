<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一次任务的处理流程：消息进入、判断类型、抄步骤、派活、验证、收尾，验证不通过回到对应步骤"><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="165.0" y="22.0" width="470.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="47.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">你的消息进主线程</text><text x="400.0" y="69.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">技能清单和启动指令已在上下文</text><line x1="400.0" y1="86.0" x2="400.0" y2="118.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect x="165.0" y="118.0" width="470.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="143.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">判断任务类型</text><text x="400.0" y="165.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">命中一本流程清单</text><line x1="400.0" y1="182.0" x2="400.0" y2="214.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect x="165.0" y="214.0" width="470.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="239.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">把步骤抄进待办</text><text x="400.0" y="261.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">这是最值得盯的地方</text><line x1="400.0" y1="278.0" x2="400.0" y2="310.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect x="165.0" y="310.0" width="470.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="335.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">按步调技能，或派子代理</text><text x="400.0" y="357.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">重活出去，主线程只留判断</text><line x1="400.0" y1="374.0" x2="400.0" y2="416.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#flow-arrow)"/><polygon points="400,416 492,452 400,488 308,452" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="400" y="456.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">需要验证？</text><text x="416.0" y="440.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">是</text><line x1="400.0" y1="488.0" x2="400.0" y2="528.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect x="165.0" y="528.0" width="470.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="400.0" y="553.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">跑验证</text><text x="400.0" y="575.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">真实产物、同一次运行</text><line x1="400.0" y1="592.0" x2="400.0" y2="626.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect x="165.0" y="628.0" width="470.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="653.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">收尾</text><text x="400.0" y="675.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">按要求回报，说明跳过哪几步</text><path d="M 165.0 560.0 L 88.0 560.0 L 88.0 342.0 L 164.0 342.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#flow-arrow)"/><text x="72.0" y="450.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)" transform="rotate(-90 72.0 450.0)">不通过就回到对应步骤</text><path d="M 492.0 452.0 L 742.0 452.0 L 742.0 660.0 L 636.0 660.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#flow-arrow)"/><text x="700.0" y="442.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">否</text><text x="762.0" y="560.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)" transform="rotate(90 762.0 560.0)">直接收尾</text></svg></div><figcaption>蓝色菱形是唯一的分叉点。验证不通过时回到对应步骤，而不是从头再来。</figcaption></figure>