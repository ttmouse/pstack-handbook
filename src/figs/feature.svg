<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="做功能的八步流程：先懂、并行设计、写吞吐检查点、派实现、同面验证、重排提交、对抗争议、开 PR"><defs><marker id="feature-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="125.0" y="21.0" width="430.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="340.0" y="43.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">1 先懂再改</text><text x="340.0" y="65.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">用 how 把受影响的子系统读一遍</text><rect x="125.0" y="113.0" width="430.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="340.0" y="135.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">2 并行设计</text><text x="340.0" y="157.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">多个模型各出一版签名，交叉评审</text><rect x="125.0" y="205.0" width="430.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="340.0" y="227.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">3 写吞吐检查点</text><text x="340.0" y="249.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">四条待办，一项都不能删</text><rect x="125.0" y="297.0" width="430.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="340.0" y="319.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">4 派实现</text><text x="340.0" y="341.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">文件、数据形状、成功标准，缺一不可</text><rect x="125.0" y="389.0" width="430.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="340.0" y="411.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">5 同面验证</text><text x="340.0" y="433.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">换界面或结论不确定都不算过</text><rect x="125.0" y="481.0" width="430.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="340.0" y="503.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">6 重排成小提交</text><text x="340.0" y="525.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">每段自证过，再下一段</text><rect x="125.0" y="573.0" width="430.0" height="58.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="6 5"/><text x="340.0" y="595.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">7 有争议先对抗</text><text x="340.0" y="617.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">interrogate，小改动可跳过</text><rect x="125.0" y="665.0" width="430.0" height="58.0" rx="10" fill="var(--panel)" stroke="var(--ok)" stroke-width="1.4"/><text x="340.0" y="687.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">8 开 PR</text><text x="340.0" y="709.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">做了什么、为什么、检查点、未决</text><line x1="340.0" y1="79.0" x2="340.0" y2="107.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><line x1="340.0" y1="171.0" x2="340.0" y2="199.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><line x1="340.0" y1="263.0" x2="340.0" y2="291.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><line x1="340.0" y1="355.0" x2="340.0" y2="383.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><line x1="340.0" y1="447.0" x2="340.0" y2="475.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><line x1="340.0" y1="539.0" x2="340.0" y2="567.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><line x1="340.0" y1="631.0" x2="340.0" y2="659.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#feature-arrow)"/><rect x="588" y="176" width="292" height="140" rx="10" fill="none" stroke="var(--accent)" stroke-dasharray="6 5"/><text x="606.0" y="200.0" text-anchor="start" font-size="13" font-weight="600" fill="var(--accent2)">检查点四问</text><text x="606.0" y="226.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">阻塞第一步</text><text x="606.0" y="248.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">独立工作面</text><text x="606.0" y="270.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">共享可变状态</text><text x="606.0" y="292.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">最小安全拆分</text><path d="M 555.0 234.0 L 586.0 234.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/></svg></div><figcaption>第三、四步是全套流程的分水岭：先想清楚怎么拆，再派活。第七步虚线框表示可以跳过。</figcaption></figure>