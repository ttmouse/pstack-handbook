<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="验证链路：体检、单测门、驱动真实应用、取证、判定，不通过分产品不符与判据不成立两种"><defs><marker id="verify-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="150.0" y="19.0" width="460.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="380.0" y="41.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">1 体检</text><text x="380.0" y="63.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">进程号、版本、是不是这次启动的</text><line x1="380.0" y1="77.0" x2="380.0" y2="111.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#verify-arrow)"/><rect x="150.0" y="111.0" width="460.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="380.0" y="133.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">2 单测门</text><text x="380.0" y="155.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">跑得快，先筛掉明显的</text><line x1="380.0" y1="169.0" x2="380.0" y2="203.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#verify-arrow)"/><rect x="150.0" y="203.0" width="460.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="380.0" y="225.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">3 驱动真实应用</text><text x="380.0" y="247.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">用驱动工具，不靠手点和肉眼</text><line x1="380.0" y1="261.0" x2="380.0" y2="295.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#verify-arrow)"/><rect x="150.0" y="295.0" width="460.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="380.0" y="317.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">4 取证</text><text x="380.0