roke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#verify-arrow)"/><text x="660.0" y="410.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">不过</text><line x1="400.0" y1="549.0" x2="400.0" y2="592.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#verify-arrow)"/><rect x="200.0" y="597.0" width="400.0" height="58.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="400.0" y="619.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">维护日志加一行</text><text x="400.0" y="641.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">这次验了什么、哪里容易误判</text><path d="M 785.0 520.0 L 856.0 520.0 L 856.0 452.0 L 404.0 452.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#verify-arrow)"/><text x="872.0" y="486.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)" transform="rotate(-90 872.0 486.0)">改完重跑</text></svg></div><figcaption>判定失败只有两种原因：产品真的不符，或者你的标准本身不成立。先分清，再动手。</figcaption></figure>