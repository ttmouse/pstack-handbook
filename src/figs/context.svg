<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="常驻式与按需式的上下文占用对比：整篇文件每次加载，或只加载描述、命中后再读正文"><defs><marker id="context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><text x="200.0" y="40.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--accent2)">常驻式（写进 CLAUDE.md）</text><text x="640.0" y="40.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--accent2)">按需式（写成技能）</text><rect x="60" y="66" width="280" height="238" rx="10" fill="var(--panel2)" stroke="var(--line)"/><text x="200.0" y="130.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">整篇文件</text><text x="200.0" y="158.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted)">每次会话全文加载</text><text x="200.0" y="200.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">写五个技能就开始挤</text><text x="200.0" y="222.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">写二十个必然撑爆</text><rect x="171.0" y="253.0" width="58.0" height="18" rx="9" fill="none" stroke="var(--bad)" stroke-width="1"/><text x="200.0" y="265.8" text-anchor="middle" font-size="11" fill="var(--bad)">每次都付</text><rect x="500" y="66" width="280" height="9" rx="4" fill="var(--accent)" opacity="0.45"/><rect x="500" y="84" width="280" height="9" rx="4" fill="var(--accent)" opacity="0.45"/><rect x="500" y="102" width="280" height="9" rx="4" fill="var(--accent)" opacity="0.45"/><rect x="500" y="120" width="280" height="9" rx="4" fill="var(--accent)" opacity="0.45"/><rect x="500" y="138" width="280" height="9" rx="4" fill="var(--accent)" opacity="0.45"/><rect x="500" y="156" width="280" height="9" rx="4" fill="var(--accent)" opacity="0.45"/><text x="640.0" y="186.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted)">43 条描述常驻，很薄</text><text x="790.0" y="82.0" text-anchor="start" font-size="14" font-weight="400" fill="var(--muted)">…</text><line x1="640.0" y1="200.0" x2="640.0" y2="226.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#context-arrow)"/><rect x="500" y="230" width="280" height="74" rx="10" fill="var(--panel2)" stroke="var(--accent)"/><text x="640.0" y="258.0" text-anchor="middle" font-size="14" font-weight="600" fill="var(--fg)">命中才读正文</text><text x="640.0" y="282.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">读一次，答案留在结论里</text><rect x="611.0" y="313.0" width="58.0" height="18" rx="9" fill="none" stroke="var(--ok)" stroke-width="1"/><text x="640.0" y="325.8" text-anchor="middle" font-size="11" fill="var(--ok)">按需才付</text><text x="450.0" y="380.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted)">省下来的不是字数，是判断质量：上下文越干净，后面的取舍越准。</text><text x="450.0" y="406.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--accent2)">代价只有一条：描述写不好，这个技能就等于不存在。</text></svg></div><figcaption>左边每次都背整本书，右边平时只背目录。代价是目录必须写准。</figcaption></figure>