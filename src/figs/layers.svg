.0 340.0 L 660.0 340.0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/></svg></div><figcaption>任务从上往下走，只有路由器和技能能直接叫；流程清单只能被路由器读，原则由它按场景自选。</figcaption></figure>