<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四层结构：路由器调用流程清单，清单里的每一步由技能执行，原则由路由器按场景自选"><defs><marker id="layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><rect x="275.0" y="15.0" width="220.0" height="38.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="385.0" y="39.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">你的任务</text><line x1="385.0" y1="53.0" x2="385.0" y2="76.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#layers-arrow)"/><rect x="170.0" y="77.0" width="430.0" height="66.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="385.0" y="103.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">路由器 poteto-mode</text><text x="385.0" y="125.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">判断类型，挑清单，抄步骤</text><rect x="530.0" y="83.0" width="36.0" height="18" rx="9" fill="none" stroke="var(--ok)" stroke-width="1"/><text x="548.0" y="95.8" text-anchor="middle" font-size="11" fill="var(--ok)">能叫</text><line x1="385.0" y1="143.0" x2="385.0" y2="192.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#layers-arrow)"/><text x="463.0" y="172.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">选中一本</text><rect x="170.0" y="192.0" width="430.0" height="66.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="385.0" y="218.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">流程清单 playbook × 23</text><text x="385.0" y="240.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">修缺陷六步、做功能五步</text><rect x="520.5" y="198.0" width="47.0" height="18" rx="9" fill="none" stroke="var(--bad)" stroke-width="1"/><text x="544.0" y="210.8" text-anchor="middle"