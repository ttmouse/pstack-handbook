<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="固定上下文成本随子代理线性放大，以及同一批任务加与不加流程的花费对比"><defs><marker id="cost-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><text x="40.0" y="40.0" text-anchor="start" font-size="13" font-weight="600" fill="var(--accent2)">一 固定上下文怎么放大</text><rect x="20.0" y="68.0" width="300.0" height="64.0" rx="10" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.4"/><text x="170.0" y="93.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">主线程 3,600 词</text><text x="170.0" y="115.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">每次进流程都读一遍</text><rect x="385.0" y="68.0" width="110.0" height="64.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="440.0" y="93.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">子代理</text><text x="440.0" y="115.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">3,600 词</text><line x1="320.0" y1="100.0" x2="385.0" y2="100.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#cost-arrow)"/><rect x="505.0" y="68.0" width="110.0" height="64.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="560.0" y="93.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">子代理</text><text x="560.0" y="115.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">3,600 词</text><rect x="625.0" y="68.0" width="110.0" height="64.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="680.0" y="93.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">子代理</text><text x="680.0" y="115.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">3,600 词</text><text x="450.0" y="158.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">每开一路子代理，固定部分就再叠一份</text><text x="450.0" y="182.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">按三路算：4 × 3,600 词，这部分和任务难度无关</text><text x="40.0" y="226.0" text-anchor="start" font-size="13" font-weight="600" fill="var(--accent2)">二 同一批任务的第三方实测（5 个小题，两边都 15/15 通过）</text><text x="170.0" y="268.0" text-anchor="end" font-size="12.5" font-weight="400" fill="var(--muted)">不加流程</text><rect x="180" y="250" width="451" height="30" rx="6" fill="var(--panel2)" stroke="var(--line)"/><text x="640.0" y="270.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">$2.44</text><text x="170.0" y="328.0" text-anchor="end" font-size="12.5" font-weight="400" fill="var(--muted)">加了流程</text><rect x="180" y="310" width="640" height="30" rx="6" fill="var(--accent)" opacity="0.75"/><text x="828.0" y="330.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">$3.46</text><text x="40.0" y="386.0" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted)">多花约四成，结果一样。简单任务上，这套流程是纯成本。</text></svg></div><figcaption>上：固定上下文按子代理数线性叠加。下：唯一一个公开的第三方对比，结果没有区别。</figcaption></figure>