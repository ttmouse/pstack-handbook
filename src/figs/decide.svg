<figure class="devfig"><div class="figscroll"><svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="判断要不要走完整流程的三道门：改一行、能不能判定、要不要复现真实产物"><defs><marker id="decide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--muted)"/></marker></defs><polygon points="300,38 450,80 300,122 150,80" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="300" y="84.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">改一行、查事实、跑命令？</text><polygon points="300,163 450,205 300,247 150,205" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="300" y="209.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">完成标准能写成可判定的？</text><polygon points="300,288 450,330 300,372 150,330" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="300" y="334.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">要复现或验证真实产物？</text><rect x="130.0" y="417.0" width="340.0" height="62.0" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.4"/><text x="300.0" y="441.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">走完整流程</text><text x="300.0" y="463.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">poteto-mode 按类型选清单</text><line x1="450.0" y1="80.0" x2="553.0" y2="80.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#decide-arrow)"/><rect x="555.0" y="52.0" width="290.0" height="56.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="700.0" y="73.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">直接做</text><text x="700.0" y="95.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">不走任何流程</text><text x="500.0" y="70.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">是</text><line x1="450.0" y1="205.0" x2="553.0" y2="205.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#decide-arrow)"/><rect x="555.0" y="177.0" width="290.0" height="56.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="700.0" y="198.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">先定义完成标准</text><text x="700.0" y="220.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">流程救不了模糊目标</text><text x="500.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">否</text><line x1="450.0" y1="330.0" x2="553.0" y2="330.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#decide-arrow)"/><rect x="555.0" y="302.0" width="290.0" height="56.0" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><text x="700.0" y="323.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)">单个技能够用</text><text x="700.0" y="345.0" text-anchor="middle" font-size="12.5" fill="var(--muted)">how / why / teach</text><text x="500.0" y="320.0" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted)">否</text><line x1="300.0" y1="122.0" x2="300.0" y2="163.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#decide-arrow)"/><text x="314.0" y="148.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">否</text><line x1="300.0" y1="247.0" x2="300.0" y2="288.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#decide-arrow)"/><text x="314.0" y="273.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">是</text><line x1="300.0" y1="372.0" x2="300.0" y2="415.0" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#decide-arrow)"/><text x="314.0" y="398.0" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted)">是</text></svg></div><figcaption>从上往下问，第一个命中的就停。判断不了就先当成要验证，多花的钱比返工便宜。</figcaption></figure>